<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo - Projeto Solaris</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li><a href="index.html">Meu Jardim</a></li>
          <li><a href="catalogo.html" aria-current="page">Pesquisar Plantas</a></li>
        </ul>
      </nav>
    </header>
  
    <main>
      <h1>Catalogo de plantas</h1>
      
      <section class="secao-busca">
        <h2>Busca de plantas</h2>
        <form id="form-busca" action="#" method="GET">
          <label for="busca">Nome planta:</label>
          <input type="search" id="busca" name="q" placeholder="Ex: Tomate Cereja">
          <button type="submit">Buscar</button>
        </form>
      </section>

      <section class="secao-resultados">
        <h2>Resultado de pesquisa</h2>
        <div class="container-cards" id="container-resultados">
          <article class="card-planta">
            <figure>
              <img src="assets/images/tomate-cereja.jpg" alt="Muda de tomate cereja em vaso pequeno" width="250" height="200" loading="lazy">
            </figure>
            <h3>Tomate cereja</h3>
            <p>Luz: Sol pleno | Dificuldade: Média</p>
            <button type="button">Adicionar ao Jardim</button>
          </article>
        </div>
      </section>
    </main>

    <footer>
      <p>Projeto desenvolvido para disciplina SCOM</p>
    </footer>
    <script type="module" src="js/catalogoApp.js"></script>
  </body>
</html>
