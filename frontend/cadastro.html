<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crie sua conta no Projeto Solaris e comece o seu jardim virtual.">
    <title>Criar conta - Projeto Solaris</title>
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <a class="link-pular" href="#conteudo-principal">Pular para o conteúdo principal</a>

    <header>
      <nav aria-label="Navegação principal">
        <ul>
          <li><a href="index.html">Meu Jardim</a></li>
          <li><a href="catalogo.html">Pesquisar Plantas</a></li>
        </ul>
      </nav>
    </header>

    <main id="conteudo-principal">
      <h1>Criar conta</h1>

      <form id="form-cadastro" class="formulario">
        <p class="mensagem-erro" role="alert" hidden></p>

        <div class="campo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" autocomplete="name"
                 required minlength="2" maxlength="80" aria-describedby="erro-nome">
          <p class="erro-campo" id="erro-nome"></p>
        </div>

        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" autocomplete="email"
                 required maxlength="254" aria-describedby="erro-email">
          <p class="erro-campo" id="erro-email"></p>
        </div>

        <div class="campo">
          <label for="senha">Senha (mínimo 8 caracteres)</label>
          <input type="password" id="senha" name="senha" autocomplete="new-password"
                 required minlength="8" maxlength="72" aria-describedby="erro-senha">
          <p class="erro-campo" id="erro-senha"></p>
        </div>

        <div class="campo">
          <label for="confirmacao">Confirme a senha</label>
          <input type="password" id="confirmacao" name="confirmacao" autocomplete="new-password"
                 required maxlength="72" aria-describedby="erro-confirmacao">
          <p class="erro-campo" id="erro-confirmacao"></p>
        </div>

        <button type="submit" class="botao">Criar conta</button>
      </form>

      <p class="texto-centro">Já tem conta? <a href="login.html">Entrar</a></p>
    </main>

    <footer>
      <p>Projeto desenvolvido para a disciplina SCOM.</p>
    </footer>

    <script src="js/utils.js"></script>
    <script src="js/models/apiCliente.js"></script>
    <script src="js/models/authModel.js"></script>
    <script src="js/views/formularioView.js"></script>
    <script src="js/views/menuSessao.js"></script>
    <script src="js/cadastroApp.js"></script>
  </body>
</html>
