<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Perfil da planta no Projeto Solaris: fase de crescimento, estado de rega e a linha do tempo simulada da germinação até a fase adulta.">
    <title>Perfil da planta - Projeto Solaris</title>
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
    <!-- Evita o salto de layout (CLS). Sem isto o navegador pinta a pagina com
         os containers ainda vazios e tudo abaixo salta quando o JS injeta os
         cards — um CLS de 0,53. Escondendo o conteudo ate a montagem, os cards
         aparecem ja na posicao final. O tempo-limite garante que a pagina
         apareca mesmo se algum script falhar, e quem esta sem JavaScript nunca
         recebe a classe. -->
    <script>
      document.documentElement.classList.add('js-montando');
      setTimeout(function () {
        document.documentElement.classList.remove('js-montando');
      }, 2000);
    </script>
  </head>
  <body>
    <a class="link-pular" href="#conteudo-principal">Pular para o conteúdo principal</a>

    <header>
      <nav aria-label="Navegação principal">
        <ul>
          <li><a href="index.html">Meu Jardim</a></li>
          <li><a href="catalogo.html">Pesquisar Plantas</a></li>
        </ul>
      </nav>
    </header>

    <main id="conteudo-principal">
      <h1 id="titulo-planta">Perfil da planta</h1>

      <noscript>
        <p class="mensagem-status">
          Esta página depende de JavaScript para carregar os dados da planta. Habilite o JavaScript no navegador.
        </p>
      </noscript>

      <!-- Região viva: confirma a rega a leitores de tela após o clique. -->
      <p id="feedback-rega" class="visualmente-oculto" aria-live="polite"></p>

      <div id="conteudo-perfil"></div>
    </main>

    <footer>
      <p>Projeto desenvolvido para a disciplina SCOM.</p>
    </footer>

    <!-- Scripts clássicos carregados na ordem de dependência.
         Sem ES Modules, o projeto abre direto por file:// sem servidor. -->
    <script src="js/utils.js"></script>
    <script src="js/models/imagemModel.js"></script>
    <script src="js/models/simulacaoModel.js"></script>
    <script src="js/models/jardimModel.js"></script>
    <script src="js/viewmodels/jardimViewModel.js"></script>
    <script src="js/views/cardPlanta.js"></script>
    <script src="js/perfilApp.js"></script>
  </body>
</html>
