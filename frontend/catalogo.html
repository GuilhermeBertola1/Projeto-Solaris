<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Catálogo de plantas do Projeto Solaris: pesquise espécies por nome popular ou científico e adicione as que quiser cultivar ao seu jardim virtual.">
    <title>Catálogo de plantas - Projeto Solaris</title>
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <a class="link-pular" href="#conteudo-principal">Pular para o conteúdo principal</a>

    <header>
      <nav aria-label="Navegação principal">
        <ul>
          <li><a href="index.html">Meu Jardim</a></li>
          <li><a href="catalogo.html" aria-current="page">Pesquisar Plantas</a></li>
        </ul>
      </nav>
    </header>

    <main id="conteudo-principal">
      <h1>Catálogo de plantas</h1>

      <section class="secao-busca">
        <h2>Busca de plantas</h2>
        <form id="form-busca" action="#" method="get">
          <label for="busca">Nome da planta:</label>
          <input type="search" id="busca" name="q" placeholder="Ex: Tomate cereja">
          <button type="submit" class="botao">Buscar</button>
        </form>
      </section>

      <!-- Região viva: anuncia a leitores de tela quando uma planta é
           adicionada ao jardim, sem precisar de alert(). -->
      <p id="feedback-jardim" class="visualmente-oculto" aria-live="polite"></p>

      <section class="secao-resultados">
        <h2>Resultado da pesquisa</h2>
        <noscript>
          <p class="mensagem-status">
            Este catálogo depende de JavaScript para buscar as plantas. Habilite o JavaScript no navegador para usar esta página.
          </p>
        </noscript>
        <div class="container-cards" id="container-resultados"></div>
        <p class="texto-centro">
          <button type="button" class="botao botao--secundario" id="btn-mais" hidden>Mostrar mais plantas</button>
        </p>
      </section>
    </main>

    <footer>
      <p>Projeto desenvolvido para a disciplina SCOM.</p>
    </footer>

    <!-- Scripts clássicos carregados na ordem de dependência.
         Sem ES Modules, o projeto abre direto por file:// sem servidor. -->
    <script src="js/utils.js"></script>
    <script src="js/models/apiCliente.js"></script>
    <script src="js/models/authModel.js"></script>
    <script src="js/views/menuSessao.js"></script>
    <script src="js/models/imagemModel.js"></script>
    <script src="js/models/simulacaoModel.js"></script>
    <script src="js/models/plantasModel.js"></script>
    <script src="js/models/jardimModel.js"></script>
    <script src="js/viewmodels/catalogoViewModel.js"></script>
    <script src="js/views/cardPlanta.js"></script>
    <script src="js/catalogoApp.js"></script>
  </body>
</html>
